[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frauddet"
version = "0.1.0"
description = "Real-time credit-card fraud detection on a severely imbalanced dataset: SMOTE + XGBoost + Isolation Forest ensemble, SHAP explainability, a streaming WebSocket API and a live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanny Un Sowadh Wamik" }]
keywords = ["fraud-detection", "imbalanced-learning", "smote", "xgboost", "shap", "websockets", "streaming"]

dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
models = ["imbalanced-learn>=0.12", "shap>=0.45", "mlflow>=2.12"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12"]
app = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/frauddet"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
"conftest.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends", "fastapi.WebSocket", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
